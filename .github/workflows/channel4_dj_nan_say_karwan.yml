name: "📻 Channel 4 - DJ JAY LAL BARBASPUR (CopyRight-Work Daily 01:30 AM IST)"

on:
  # Triggered exclusively via Cloudflare Worker API to prevent duplicate runs
  workflow_dispatch:
    inputs:
      skip_upload:
        description: 'Skip YouTube Upload (Test Only)'
        required: false
        default: false
        type: boolean

jobs:
  launch-copyright-work:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade kaggle requests

      - name: Configure Kaggle API
        run: |
          mkdir -p ~/.kaggle
          echo '{"username":"${{ secrets.KAGGLE_USERNAME }}","key":"${{ secrets.KAGGLE_KEY }}"}' > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Deploy & Trigger CopyRight-Work Production (Fast CPU)
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN_COPY_RIGHT_WORK: ${{ secrets.YOUTUBE_REFRESH_TOKEN_COPY_RIGHT_WORK }}
          YOUTUBE_COOKIES_B64: ${{ secrets.YOUTUBE_COOKIES_B64 }}
          ALERT_GMAIL_APP_PASS: ${{ secrets.ALERT_GMAIL_APP_PASS }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          DJ_PROFILE: copy_right_work
          ENABLE_GPU: 'false'
          DJ_SKIP_UPLOAD: ${{ inputs.skip_upload || 'false' }}
        run: |
          python push_to_kaggle.py
