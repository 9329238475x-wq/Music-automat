name: Run Autonomous DJ Remix Pipeline

on:
  schedule:
    # 09:06 AM IST (03:36 UTC) - Daily Morning Nagpuri DJ Mix
    - cron: '36 3 * * *'
    # 07:00 PM IST (13:30 UTC) - Daily Evening Hard Vibration DJ Mix
    - cron: '30 13 * * *'

  workflow_dispatch:

jobs:
  launch-kaggle-production:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade kaggle requests

      - name: Configure Kaggle API
        run: |
          mkdir -p ~/.kaggle
          echo '{"username":"${{ secrets.KAGGLE_USERNAME }}","key":"${{ secrets.KAGGLE_KEY }}"}' > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Deploy & Trigger Kaggle Autonomous Runner
        run: |
          python push_to_kaggle.py
