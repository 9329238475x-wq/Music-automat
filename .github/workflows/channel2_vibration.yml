name: "🔊 Channel 2 - Sumit RMX 6.0 (Vibration Daily 07:00 PM)"

on:
  schedule:
    # 07:00 PM IST = 13:30 UTC
    - cron: '30 13 * * *'
  workflow_dispatch:
    inputs:
      target_tracks:
        description: 'Number of Tracks'
        required: false
        default: '40'
      skip_upload:
        description: 'Skip YouTube Upload (Test Only)'
        required: false
        default: false
        type: boolean

jobs:
  launch-vibration:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade kaggle requests

      - name: Configure Kaggle API
        run: |
          mkdir -p ~/.kaggle
          echo '{"username":"${{ secrets.KAGGLE_USERNAME }}","key":"${{ secrets.KAGGLE_KEY }}"}' > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Deploy & Trigger Vibration Production
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN_VIBRATION: ${{ secrets.YOUTUBE_REFRESH_TOKEN_VIBRATION }}
          ALERT_GMAIL_APP_PASS: ${{ secrets.ALERT_GMAIL_APP_PASS }}
          DJ_PROFILE: vibration
          DJ_TARGET_TRACKS: ${{ inputs.target_tracks || '40' }}
          DJ_SKIP_UPLOAD: ${{ inputs.skip_upload }}
        run: |
          python push_to_kaggle.py
