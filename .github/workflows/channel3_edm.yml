name: "⚡ Channel 3 - Mega Music Nonstop EDM (Daily 04:00 PM)"

on:
  schedule:
    - cron: '30 10 * * *'  # Daily 04:00 PM IST (10:30 UTC)
  workflow_dispatch:
    inputs:
      target_tracks:
        description: 'Number of Tracks (0 = All available from all channels)'
        required: false
        default: '0'
      skip_upload:
        description: 'Skip YouTube Upload (Test Only)'
        required: false
        default: false
        type: boolean

jobs:
  launch-edm:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade kaggle requests

      - name: Configure Kaggle API
        run: |
          mkdir -p ~/.kaggle
          echo '{"username":"${{ secrets.KAGGLE_USERNAME }}","key":"${{ secrets.KAGGLE_KEY }}"}' > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Deploy & Trigger EDM Production
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN_EDM: ${{ secrets.YOUTUBE_REFRESH_TOKEN_EDM }}
          ALERT_GMAIL_APP_PASS: ${{ secrets.ALERT_GMAIL_APP_PASS }}
          DJ_PROFILE: edm
          DJ_TARGET_TRACKS: ${{ inputs.target_tracks || '0' }}
          DJ_SKIP_UPLOAD: ${{ inputs.skip_upload || 'false' }}
        run: |
          python push_to_kaggle.py
