name: "📻 Channel 1 - Sumit Rmx 2.0 (Nagpuri Daily 09:06 AM)"

on:
  schedule:
    # 09:06 AM IST = 03:36 UTC
    - cron: '36 3 * * *'
  workflow_dispatch:
    inputs:
      target_tracks:
        description: 'Number of Tracks'
        required: false
        default: '20'
      skip_upload:
        description: 'Skip YouTube Upload (Test Only)'
        required: false
        default: false
        type: boolean

jobs:
  launch-nagpuri:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install --upgrade kaggle requests

      - name: Configure Kaggle API
        run: |
          mkdir -p ~/.kaggle
          echo '{"username":"${{ secrets.KAGGLE_USERNAME }}","key":"${{ secrets.KAGGLE_KEY }}"}' > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Deploy & Trigger Nagpuri Production
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN_NAGPURI: ${{ secrets.YOUTUBE_REFRESH_TOKEN_NAGPURI }}
          ALERT_GMAIL_APP_PASS: ${{ secrets.ALERT_GMAIL_APP_PASS }}
          DJ_PROFILE: nagpuri
          DJ_TARGET_TRACKS: ${{ inputs.target_tracks || '20' }}
          DJ_SKIP_UPLOAD: ${{ inputs.skip_upload }}
        run: |
          python push_to_kaggle.py
